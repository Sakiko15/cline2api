name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows/amd64
            runner: windows-latest
          - target: darwin/universal
            runner: macos-latest
          - target: linux/amd64
            runner: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # ── 安装 Wails CLI ──
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      # ── Linux: WebKit2GTK 4.0 开发包 ──
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      # ── 构建：wails build 自动处理 CGO/Objective-C/Universal Binary ──
      - name: Wails build
        run: wails build -platform ${{ matrix.target }} -clean -trimpath -ldflags "-s -w"

      # ── Windows: 验证自检 ──
      - name: Verify selfcheck (Windows)
        if: runner.os == 'Windows'
        working-directory: build/bin
        run: ./cline-proxy-desktop.exe -selfcheck

      # ── 上传产物 ──
      - uses: actions/upload-artifact@v4
        with:
          name: cline-proxy-desktop-${{ matrix.target }}
          path: build/bin/*

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            cline-proxy-desktop-windows-amd64/cline-proxy-desktop.exe
            cline-proxy-desktop-darwin-universal/cline-proxy-desktop
            cline-proxy-desktop-linux-amd64/cline-proxy-desktop
