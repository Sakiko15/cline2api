name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            runner: windows-latest
            artifact: cline-proxy-desktop.exe
          - os: darwin
            arch: arm64
            runner: macos-latest
            artifact: cline-proxy-desktop-darwin-arm64
          - os: linux
            arch: amd64
            runner: ubuntu-22.04
            artifact: cline-proxy-desktop-linux-amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build desktop app
        env:
          CGO_LDFLAGS: ${{ runner.os == 'macOS' && '-framework UniformTypeIdentifiers' || '' }}
        run: go build -tags "desktop production" -trimpath -ldflags="-s -w${{ matrix.os == 'windows' && ' -H windowsgui' || '' }}" -o ${{ matrix.artifact }} .

      - name: Verify selfcheck
        if: runner.os != 'Linux'
        run: ./${{ matrix.artifact }} -selfcheck

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            */cline-proxy-desktop.exe
            */cline-proxy-desktop-darwin-arm64
            */cline-proxy-desktop-linux-amd64
