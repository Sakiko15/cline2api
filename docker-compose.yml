# 首次启动前必须先 touch 三个数据文件（见 docs/deploy-1panel.md 第 3 节）：
# 否则 Docker 会把挂载路径建成目录，容器内写入静默失败。
services:
  cline-proxy:
    image: ghcr.io/sakiko15/cline2api:latest
    pull_policy: always
    container_name: cline-proxy
    restart: unless-stopped
    ports:
      - "3457:3457"
    volumes:
      - ./.cline-accounts.json:/app/.cline-accounts.json
      - ./.cline-config.json:/app/.cline-config.json
      - ./.cline-zen.json:/app/.cline-zen.json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3457/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s