# 数据目录整体挂载：无需预创建任何文件（目录不存在时 Docker 自动创建，
# 类型恰好正确）。单文件 bind mount 无法承载 tmp+rename 原子写（EBUSY），
# 故不再按文件挂载。数据目录由镜像内 ENV CLINE_DATA_DIR=/app/data 指定。
services:
  cline-proxy:
    image: ghcr.io/sakiko15/cline2api:latest
    pull_policy: always
    container_name: cline-proxy
    restart: unless-stopped
    ports:
      - "3457:3457"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3457/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s